name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Check formatting and lint
        run: vp check

      - name: Typecheck workspaces
        run: vpr typecheck

      - name: Check architecture invariants
        run: node scripts/check-architecture.mjs

      - name: Check committed database migrations
        run: |
          vp run --filter @glass/api db:migrations
          git diff --exit-code -- infra/cloud/migrations/postgres

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: glass_m3_test
          POSTGRES_PASSWORD: glass_test
          POSTGRES_USER: glass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U glass -d glass_m3_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://glass:glass_test@127.0.0.1:5432/glass_m3_test
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Test workspaces
        run: vp run test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Ensure Electron runtime is installed
        run: vp run --filter @glass/desktop ensure:electron

      - name: Build all workspaces
        run: vp run build

      - name: Verify preload bundle output
        run: |
          test -f apps/desktop/dist-electron/preload.cjs
          grep -nE "glassDesktop|executionConnection|platform" apps/desktop/dist-electron/preload.cjs

packages:
  - apps/*
  - infra/*
  - packages/*
  - scripts

allowBuilds:
  electron: true
  electron-winstaller: false
  esbuild: true
  msgpackr-extract: false
  node-pty: true
  sharp: true
  workerd: false

catalog:
  "@better-auth/electron": 1.6.25
  "@better-auth/expo": 1.6.25
  "@effect/atom-react": 4.0.0-beta.102
  "@effect/platform-node": 4.0.0-beta.102
  "@effect/tsgo": 0.13.2
  "@effect/vitest": 4.0.0-beta.102
  "@noble/curves": 1.9.1
  "@noble/hashes": 1.8.0
  "@openeditor/core": 0.0.35
  "@openeditor/native": 0.0.35
  "@openeditor/react": 0.0.35
  "@openeditor/ui": 0.0.35
  "@pierre/diffs": 1.3.0-beta.10
  "@tanstack/react-router": 1.170.21
  "@tanstack/router-plugin": 1.168.26
  "@types/node": 24.12.4
  "@typescript/native-preview": 7.0.0-dev.20260604.1
  better-auth: 1.6.25
  effect: 4.0.0-beta.102
  expo-crypto: ~57.0.1
  jose: 6.2.6
  shiki: 4.2.0
  typescript: ~6.0.3
  vite: npm:@voidzero-dev/vite-plus-core@0.2.2
  vite-plus: 0.2.2

minimumReleaseAgeExclude:
  - "@effect/atom-react@4.0.0-beta.102"
  - "@effect/platform-node@4.0.0-beta.102"
  - "@effect/tsgo@0.13.2"
  - "@effect/vitest@4.0.0-beta.102"
  - "effect@4.0.0-beta.102"
  - "@cloudflare/workers-types@5.20260801.1"
  - wrangler@4.118.0
  - "@types/pg@8.20.3"
  - "@openeditor/*"
  - "@tanstack/history@1.162.1"
  - "@tanstack/react-router@1.170.21"
  - "@tanstack/router-core@1.171.18"
  - "@tanstack/router-generator@1.167.24"
  - "@tanstack/router-plugin@1.168.26"

overrides:
  "@effect/platform-node": "catalog:"
  "@effect/tsgo": "catalog:"
  "@effect/vitest": "catalog:"
  "@effect/vitest>vitest": "-"
  effect: "catalog:"
  vite: "catalog:"

packageExtensions:
  "@pierre/diffs@1.3.0-beta.10":
    dependencies:
      "@shikijs/transformers": ^4.2.0
  "@effect/vitest@*":
    dependencies:
      vite-plus: "catalog:"
    peerDependenciesMeta:
      vitest:
        optional: true
  "vite-plus@*":
    dependencies:
      vite: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    react: ">=19.2.3"
    vite: "*"

supportedArchitectures:
  cpu: [current, x64]
  libc: [current, glibc]
  os: [current, linux]

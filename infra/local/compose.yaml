services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${GLASS_LOCAL_POSTGRES_DATABASE}
      POSTGRES_PASSWORD: ${GLASS_LOCAL_POSTGRES_PASSWORD}
      POSTGRES_USER: glass
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glass -d ${GLASS_LOCAL_POSTGRES_DATABASE}"]
      interval: 1s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:${GLASS_LOCAL_POSTGRES_PORT}:5432"
    volumes:
      - glass-postgres:/var/lib/postgresql/data

volumes:
  glass-postgres:
